name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked make check
      - run: git diff --exit-code -- data/feasibility docs/feasibility.md data/trajectories docs/trajectory-results.md
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: make restore-r
      - run: uv run --locked make check-r
